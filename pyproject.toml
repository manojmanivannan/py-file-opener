[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-file-opener"
version = "0.2.0"
description = "Interactively pick and open files in your terminal editor"
readme = "README.md"
requires-python = ">=3.9.2"
dependencies = [
    "inquirer>=3.4.1",
]

[project.scripts]
py-file-opener = "py_file_opener.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]